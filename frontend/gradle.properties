# JVM arguments for the Gradle daemon — keep modest so low-memory CI machines work.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is required for Jetpack Compose.
android.useAndroidX=true

# Official Kotlin code style (4-space indent, trailing commas).
kotlin.code.style=official

# Faster builds: parallel module execution and build cache.
org.gradle.parallel=true
org.gradle.caching=true
