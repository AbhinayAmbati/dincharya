# Dincharya release APK builder.
# On release published, build the signed APK and attach it to the release.
name: Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-apk:
    name: Build and attach APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # The signing key never touches the repo. It lives in GitHub secrets
      # and is handed to Gradle as environment variables.
      - name: Build release APK (signed)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Rename APK for the release
        run: cp app/build/outputs/apk/release/app-release.apk "Dincharya-${{ github.event.release.tag_name }}.apk"

      - name: Attach APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/Dincharya-*.apk
