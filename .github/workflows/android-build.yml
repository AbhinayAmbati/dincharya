# Dincharya — Android CI.
# On every push: build the debug APK and run unit tests, then publish the APK
# as a downloadable artifact on the workflow run page.
#
# We invoke Gradle via `bash ./gradlew` so the build does not depend on the
# executable bit surviving whatever machine the code was committed from.
name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches the Gradle user home between runs; speeds up builds massively.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Run unit tests
        run: bash ./gradlew --no-daemon testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dincharya-debug-apk
          path: frontend/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
