# Dincharya — Android CI.
# On every push: build the release APK and run unit tests, then publish the APK
# as a downloadable artifact on the workflow run page.
#
# We invoke Gradle via `bash ./gradlew` so the build does not depend on the
# executable bit surviving whatever machine the code was committed from.
name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches the Gradle user home between runs; speeds up builds massively.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Run unit tests
        run: bash ./gradlew --no-daemon testDebugUnitTest

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dincharya-release-apk
          path: frontend/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
